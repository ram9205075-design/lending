 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join WhatsApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Poster -->
        <div class="poster-card">
            <img
                src="images/poster.jpg"
                alt="Promotional Poster"
                class="poster"
            >
        </div>


        <!-- WhatsApp CTA -->
        <div class="join-card">

            <div class="whatsapp-logo">
                <span>✓</span>
            </div>

            <h1>Join Our WhatsApp Group</h1>

            <p>
                Get the latest updates directly on WhatsApp.
            </p>

            <a
                href="#"
                id="whatsappBtn"
                class="whatsapp-btn"
            >
                <span class="wa-icon">◉</span>
                <span>WhatsApp Join</span>
                <span class="arrow">›</span>
            </a>

            <div class="secure">
                🔒 Your information is safe with us
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
